name: pooja

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: pooja_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1536m
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - pooja_network

  redis:
    image: redis:7.2-alpine
    container_name: pooja_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    mem_limit: 384m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging
    networks:
      - pooja_network

  migrate:
    build:
      context: ./backend
      target: migrate
    container_name: pooja_migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pooja_network

  api:
    build:
      context: ./backend
      target: runtime
    container_name: pooja_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      INTERNAL_KEY: ${INTERNAL_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      RUN_CRONS: "false"
    mem_limit: 1024m
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging
    networks:
      - pooja_network

  worker:
    build:
      context: ./backend
      target: runtime
    container_name: pooja_worker
    restart: unless-stopped
    command: ["node", "dist/worker.main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=5
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      RUN_CRONS: "true"
    mem_limit: 512m
    cpu_shares: 256
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging
    networks:
      - pooja_network

  web:
    build:
      context: ./frontend
    container_name: pooja_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
      NEXT_PUBLIC_LIVEKIT_URL: wss://live.${DOMAIN}
    mem_limit: 768m
    cpu_shares: 512
    logging: *logging
    networks:
      - pooja_network

  livekit:
    image: livekit/livekit-server:v1.7.2
    container_name: pooja_livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7882:7882/udp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "30000-30050:30000-30050/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    mem_limit: 1536m
    cpu_shares: 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *logging
    networks:
      - pooja_network

  nginx:
    image: nginx:1.26-alpine
    container_name: pooja_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/pooja/certbot-www:/var/www/certbot:ro
    mem_limit: 128m
    cpu_shares: 512
    depends_on:
      - web
      - api
      - livekit
    logging: *logging
    networks:
      - pooja_network

networks:
  pooja_network:
    name: pooja_network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
