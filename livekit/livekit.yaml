port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: true

turn:
  enabled: true
  domain: turn.platform-domain.com
  cert_file: /etc/letsencrypt/live/platform-domain.com/fullchain.pem
  key_file: /etc/letsencrypt/live/platform-domain.com/privkey.pem
  tls_port: 5349
  udp_port: 3478
  external_tls: false
  relay_range_start: 30000
  relay_range_end: 30050

room:
  auto_create: false
  empty_timeout: 600

webhook:
  api_key: pooja
  urls:
    - http://api:4000/api/v1/webhooks/livekit

logging:
  level: info
  pion_level: warn
