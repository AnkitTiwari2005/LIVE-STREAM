# Generated by scripts/refresh-cloudflare.sh (monthly cron) into /etc/nginx/cloudflare/ - a directory
# the stock nginx.conf does NOT auto-include. (In conf.d/ they were included twice: nginx refuses to
# start on the duplicate real_ip_header, and allow/deny would also leak to every other server.)
#   realip.conf -> set_real_ip_from lines (IPv4 and IPv6) + real_ip_header CF-Connecting-IP;
#   peers.conf  -> geo $realip_remote_addr $cf_peer { ... }  (1 = the TCP peer is Cloudflare/private)
# The allow-list must test the TCP peer: after realip, $remote_addr is the visitor, who is never in a
# Cloudflare range, so `allow <cloudflare ranges>; deny all;` would return 403 to every real user.
include /etc/nginx/cloudflare/realip.conf;
include /etc/nginx/cloudflare/peers.conf;

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Unknown host names (including direct-IP requests): refuse
server {
  listen 443 ssl default_server;
  ssl_reject_handshake on;
}
server {
  listen 80 default_server;
  return 444;
}

# HTTP: certificate checks and redirect for our names only
server {
  listen 80;
  server_name platform-domain.com www.platform-domain.com live.platform-domain.com turn.platform-domain.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# Main site and API: Cloudflare traffic only
server {
  listen 443 ssl;
  http2 on;
  server_name platform-domain.com www.platform-domain.com;
  if ($cf_peer = 0) { return 444; }

  ssl_certificate     /etc/letsencrypt/live/platform-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/platform-domain.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 15M;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; font-src 'self' data:; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; worker-src 'self' blob:;" always;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static public uploads (thumbnails, banners) from API container
  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Internal webhook is never reachable from outside
  location ^~ /api/v1/webhooks/ { return 404; }

  # Strict limit only on credential endpoints (not refresh or /me)
  location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
    limit_req zone=auth_strict burst=5 nodelay;
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_general burst=40 nodelay;
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

# LiveKit signaling (grey-cloud name, so no Cloudflare restriction)
server {
  listen 443 ssl;
  http2 on;
  server_name live.platform-domain.com;
  ssl_certificate     /etc/letsencrypt/live/platform-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/platform-domain.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
